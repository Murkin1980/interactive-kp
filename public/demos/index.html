<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interactive KP — учебный центр</title>
  <style>
    :root{color-scheme:light;--ink:#14263d;--wine:#702f35;--paper:#f3efe4;--gold:#c2a46d;--paper-bg:#fbf7ee}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}
    header{padding:48px clamp(20px,6vw,80px) 28px;border-bottom:1px solid #14263d26;background:var(--paper-bg)}
    h1{margin:8px 0;font:500 clamp(36px,6vw,68px)/1.02 Georgia,serif;letter-spacing:-.035em}
    header p{max-width:720px;color:#625c53;line-height:1.65}
    .eyebrow{color:var(--wine);font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
    .meta{display:flex;align-items:center;gap:12px;margin-top:12px;color:#71695f;font-size:13px}
    .meta .count{background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:4px;font-weight:600}
    section{padding:32px clamp(20px,6vw,80px) 0}
    section h2{font:500 clamp(24px,4vw,40px)/1.15 Georgia,serif;margin:0 0 8px;color:var(--ink)}
    section>p{color:#71695f;font-size:14px;line-height:1.6;margin:0 0 20px;max-width:720px}
    main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:24px;padding:0 clamp(20px,6vw,80px) 24px}
    article{border:1px solid #14263d24;background:#fffdf8;padding:18px;box-shadow:0 20px 60px #14263d0d;transition:box-shadow .2s}
    article:hover{box-shadow:0 8px 30px #14263d18}
    h3{margin:4px 0 7px;font:500 20px/1.15 Georgia,serif}
    .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-left:8px;vertical-align:middle}
    .badge-desktop{background:#e8f0e8;color:#2d5a2d}
    .badge-mobile{background:#e8e4f0;color:#4a3d6a}
    article p{margin:0 0 16px;color:#71695f;font-size:14px;line-height:1.55}
    .duration{font-size:12px;color:#a09888;margin-top:-12px;margin-bottom:12px}
    video{display:block;width:100%;aspect-ratio:16/10;background:#14263d;object-fit:contain;border-radius:2px}
    .error-state{display:flex;align-items:center;justify-content:center;height:100%;min-height:200px;color:#a09888;font-size:13px;text-align:center;padding:20px}
    footer{padding:24px clamp(20px,6vw,80px) 36px;color:#71695f;font-size:13px;border-top:1px solid #14263d15;margin-top:40px}
    .loading{text-align:center;padding:60px 20px;color:#71695f}
    .loading::after{content:'';display:inline-block;width:24px;height:24px;border:3px solid #14263d20;border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;margin-left:12px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:640px){main{grid-template-columns:1fr}article{padding:14px}}
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Interactive KP &middot; учебный центр</div>
    <h1>Демо кабинета мебельщика</h1>
    <p>Записи экрана реального production-интерфейса. Каждое видео показывает один рабочий сценарий от входа до результата.</p>
    <div class="meta">
      <span class="count" id="lesson-count">—</span>
      <span id="lesson-summary">загрузка...</span>
    </div>
  </header>

  <div id="lessons-container" class="loading">Загрузка манифеста...</div>

  <footer>
    Interactive KP &middot; Записи сделаны в реальном production-окружении &middot; kp.salamat-mebel.kz
  </footer>

  <script>
    const SECTIONS = [
      { heading: "Панель управления", desc: "Главный экран со статистикой, быстрыми ссылками и навигацией по разделам.", ids: ["01-login", "02-dashboard"] },
      { heading: "Клиенты", desc: "Создание, просмотр и редактирование карточек клиентов.", ids: ["03-new-client", "04-client-card"] },
      { heading: "Коммерческие предложения", desc: "Создание КП, добавление позиций и вариантов, настройки и публикация.", ids: ["05-new-kp", "06-add-item", "07-photos-sketch", "08-variants", "09-options", "10-settings"] },
      { heading: "Клиентский просмотр", desc: "Как клиент видит коммерческое предложение на телефоне и компьютере.", ids: ["11-client-view-mobile", "12-confirm-pdf"] },
      { heading: "Безопасность", desc: "Настройка блокировки аккаунта и безопасность данных.", ids: ["13-unlock-settings"] },
    ];

    function isMobile(id) { return id.includes("mobile"); }

    async function init() {
      const container = document.getElementById("lessons-container");
      try {
        const res = await fetch("manifest.json");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const manifest = await res.json();
        const lessons = new Map(manifest.lessons.map(l => [l.id, l]));

        document.getElementById("lesson-count").textContent = lessons.size;
        document.getElementById("lesson-summary").textContent = `${lessons.size} видеоинструкций`;

        container.innerHTML = "";
        container.className = "";
        container.style.padding = "0";

        for (const section of SECTIONS) {
          const sectionEl = document.createElement("section");
          sectionEl.innerHTML = `<h2>${section.heading}</h2><p>${section.desc}</p>`;

          const mainEl = document.createElement("main");

          for (const id of section.ids) {
            const lesson = lessons.get(id);
            if (!lesson) continue;

            const article = document.createElement("article");
            const badge = isMobile(id)
              ? '<span class="badge badge-mobile">Mobile</span>'
              : '<span class="badge badge-desktop">Desktop</span>';

            article.innerHTML = `
              <h3>${lesson.num}. ${lesson.title} ${badge}</h3>
              <p>${lesson.description}</p>
              <video controls preload="metadata" poster="${lesson.poster || ""}">
                <source src="${lesson.src}" type="video/mp4">
                ${lesson.srcWebm ? `<source src="${lesson.srcWebm}" type="video/webm">` : ""}
                ${lesson.subtitles ? `<track kind="subtitles" src="${lesson.subtitles}" srclang="ru" label="Русский" default>` : ""}
                <div class="error-state">Видео не может быть воспроизведено.<br>Попробуйте обновить страницу.</div>
              </video>
            `;
            mainEl.appendChild(article);
          }

          sectionEl.appendChild(mainEl);
          container.appendChild(sectionEl);
        }
      } catch (err) {
        container.className = "";
        container.innerHTML = `
          <div style="text-align:center;padding:60px 20px;color:#702f35">
            <p style="font-size:18px;font-weight:500;margin-bottom:8px">Не удалось загрузить манифест</p>
            <p style="color:#71695f;font-size:14px">${err.message}</p>
          </div>
        `;
      }
    }

    init();
  </script>
</body>
</html>
